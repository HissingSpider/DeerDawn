name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what gets in your way today. The problem matters more than the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to work on this?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
