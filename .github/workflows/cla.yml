name: CLA

# Every contributor signs the Contributor License Agreement (CLA.md) once, by
# commenting on their first pull request. Signatures are committed as JSON to
# the `cla-signatures` branch of this repository, which must exist and must NOT
# be protected (the action pushes to it with GITHUB_TOKEN).
#
# pull_request_target is required so the action can comment and set a status
# on pull requests from forks. It is safe here because this workflow never
# checks out or runs the pull request's code: the only step is the pinned
# action, which reads PR metadata through the API.
#
# contributor-assistant/github-action is archived upstream but its releases
# still work; it is pinned to the v2.6.1 commit so nothing can change under us.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Public repo only: the private repo is where the maintainer works, and the
    # cla-signatures branch exists only in the public repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/HissingSpider/DeerDawn/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          allowlist: 'HissingSpider,dependabot[bot],github-actions[bot],claude[bot],claude'
          create-file-commit-message: 'chore(cla): create CLA signature store'
          signed-commit-message: 'chore(cla): $contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [DeerDawn Contributor License Agreement](https://github.com/HissingSpider/DeerDawn/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
