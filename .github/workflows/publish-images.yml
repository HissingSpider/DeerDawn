# Publish the self-hosting images to GitHub Container Registry.
#
#   ghcr.io/<owner>/deerdawn-api
#   ghcr.io/<owner>/deerdawn-dashboard
#
# Multi-arch (linux/amd64 + linux/arm64), tagged with the release version
# (v1.2.3 -> 1.2.3, 1.2, 1) and `latest`. The root docker-compose.yml pulls
# these by default (DEERDAWN_IMAGE_REGISTRY / DEERDAWN_VERSION in .env).
#
# Triggers:
#   - Push tag v* (the same tags publish-mcp.yml releases on)
#   - Manual: Actions -> Publish Images -> Run workflow. Run from a tag it
#     republishes that release; run from a branch it pushes `edge` and the
#     short commit sha only, never `latest`.
#
# Auth is the job's GITHUB_TOKEN (packages: write); no stored secret. After the
# FIRST publish, make each package public once if the images should be pullable
# without `docker login`: GitHub -> Packages -> deerdawn-api -> Package settings
# -> Change visibility.
#
# Actions are pinned to full commit SHAs (the comment names the release).

name: Publish Images

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push ${{ matrix.image }}
    # Public repo only. The private repo also pushes v* tags (they release
    # @deerdawn/mcp-server); building images there would create the GHCR
    # packages linked to the private repo, and the public repo could then be
    # refused write access to them.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: deerdawn-api
            dockerfile: apps/api/Dockerfile
          - image: deerdawn-dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names must be lowercase; the owner login may not be.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SELF_HOSTED=true is what the dashboard image is (its Dockerfile
          # defaults to it too): analytics off, setup copy pointed at the
          # install. The API image ignores both.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SELF_HOSTED=true
            TELEMETRY_ENABLED=false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
